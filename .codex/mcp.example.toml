# Copiar a la configuración del cliente solo después de resolver la ruta local.
# Maestro 2.11.0 ofrece MCP stdio; no requiere cuentas de Maestro Cloud.
[mcp_servers.maestro]
command = "/absolute/path/Spotlight-Next/.codex/scripts/maestro.sh"
args = ["mcp", "--no-viewer", "--working-dir", "/absolute/path/Spotlight-Next"]
enabled_tools = ["list_devices", "take_screenshot", "run", "inspect_screen", "cheat_sheet"]
