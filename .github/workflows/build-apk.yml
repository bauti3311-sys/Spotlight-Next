name: Build Debug APK

# Manual delivery of already-tested Android source. No device tests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 8dd25249268fc072d1871e037fe6d7a4112795d1

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build debug only
        run: bash gradlew :app:assembleDebug --build-cache --no-daemon --max-workers=2 --console=plain
      - name: Package and verify APK and matching source
        run: |
          mkdir -p delivery/apk delivery/source
          cp app/build/outputs/apk/debug/app-debug.apk delivery/apk/Spotlight-Next-debug-8dd2524.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs delivery/apk/Spotlight-Next-debug-8dd2524.apk > delivery/apk/certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging delivery/apk/Spotlight-Next-debug-8dd2524.apk > delivery/apk/package.txt
          git archive --format=zip --prefix=Spotlight-Next-8dd2524/ --output=delivery/source/Spotlight-Next-source-8dd2524.zip "$SOURCE_SHA"
          unzip -t delivery/source/Spotlight-Next-source-8dd2524.zip > /dev/null
          (cd delivery/apk && sha256sum Spotlight-Next-debug-8dd2524.apk > SHA256SUMS)
          (cd delivery/source && sha256sum Spotlight-Next-source-8dd2524.zip > SHA256SUMS)
          printf '%s\n' "$SOURCE_SHA" > delivery/apk/SOURCE_COMMIT
          printf '%s\n' "$SOURCE_SHA" > delivery/source/SOURCE_COMMIT
          {
            echo '### APK debug de prueba; no release ni firma histórica'
            echo "Fuente exacta: $SOURCE_SHA"
            echo 'La APK se recompila en este runner: hash y certificado debug pueden diferir de los archivos locales.'
            echo 'Compatibilidad de actualización con la instalación anterior: no verificada.'
            echo '```text'
            stat -c '%n: %s bytes' delivery/apk/*.apk delivery/source/*.zip
            cat delivery/apk/SHA256SUMS delivery/source/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: Spotlight-Next-debug-8dd2524
          path: delivery/apk/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload complete source ZIP
        id: source
        uses: actions/upload-artifact@v4
        with:
          name: Spotlight-Next-source-8dd2524
          path: delivery/source/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Browser download links
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
          SOURCE_URL: ${{ steps.source.outputs.artifact-url }}
        run: |
          echo "[Descargar APK debug (ZIP de artefacto)]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Descargar ZIP fuente (ZIP de artefacto)]($SOURCE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Requiere sesión en GitHub con acceso al repositorio privado. Extraer ZIP del artefacto para obtener archivo.' >> "$GITHUB_STEP_SUMMARY"
