name: Spotlight Android gate or Preview (manual)

# Manual only. Select feat/raycast-sidebar-permissions-20261020 in the Actions UI.
# This file also exists on main, so GitHub can show its Run workflow button.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'directed-tests: compile + directed unit tests, no APK. preview: existing delivery flow.'
        type: choice
        options: [directed-tests, preview]
        default: directed-tests
        required: true
      source_sha:
        description: 'Exact 40-character source SHA. Initial functional gate: 085142ea.'
        type: string
        default: '085142ea35bd7d19085d45118ee1776b1c80d721'
        required: true

permissions:
  contents: read

concurrency:
  group: raycast-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  directed-gate:
    if: github.repository == 'bauti3311-sys/Spotlight-Next' && (github.ref == 'refs/heads/feat/raycast-sidebar-permissions-20261020' || github.ref == 'refs/heads/feat/antigravity-tablet-20261026') && inputs.mode == 'directed-tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SPOTLIGHT_GRADLE_BIN: gradle
    steps:
      - name: Validate exact source request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::A full lowercase source SHA is required.'; exit 2; }
          case "$GITHUB_REF" in
            refs/heads/feat/raycast-sidebar-permissions-20261020|refs/heads/feat/antigravity-tablet-20261026) ;;
            *) echo '::error::Unsupported workflow branch for directed-gate.'; exit 2 ;;
          esac

      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source ancestry and preserve identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          target_branch="${GITHUB_REF#refs/heads/}"
          test "$target_branch" != "$GITHUB_REF"
          git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/$target_branch"
          mkdir -p gate-evidence
          git rev-parse HEAD > gate-evidence/SOURCE_SHA.txt
          printf '%s\n' "${GITHUB_WORKFLOW_SHA:-$GITHUB_SHA}" > gate-evidence/WORKFLOW_SHA.txt
          printf '%s\n' "$GITHUB_WORKFLOW_REF" > gate-evidence/WORKFLOW_REF.txt
          test -f scripts/test-d28-directed.sh
          test -f scripts/directed-tests.init.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse Android SDK installation
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Ensure only required Android compile packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Restore Gradle 8.10.2 and dependency caches
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Compile production and unit test sources once
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | tee gate-evidence/java.log
          gradle --version | tee gate-evidence/gradle.log
          gradle :app:compileDebugUnitTestKotlin :app:warmDirectedTestRuntime -I scripts/directed-tests.init.gradle \
            --no-daemon --max-workers=1 --console=plain --stacktrace \
            2>&1 | tee gate-evidence/compile.log

      - name: Directed groups UI then D28 and integrations
        id: directed
        shell: bash
        run: |
          set -euo pipefail
          # Compile/warmup above may download missing dependencies. Tests use the
          # source's existing offline runner; Robolectric may fetch its own runtime.
          for group in ui d28 capabilities spotify cast imports metrics sources; do
            touch "gate-evidence/$group.started"
            # Do not attribute a previous group's XML to a runner that fails early.
            rm -f app/build/test-results/testDebugUnitTest/*.xml
            if bash scripts/test-d28-directed.sh "$group" 2>&1 | tee "gate-evidence/$group.log"; then
              result=0
            else
              result=$?
            fi
            # Gradle replaces this directory on the next test invocation.
            mkdir -p "gate-evidence/results/$group"
            if [[ -d app/build/test-results/testDebugUnitTest ]]; then
              find app/build/test-results/testDebugUnitTest -maxdepth 1 -type f -name '*.xml' -exec cp -t "gate-evidence/results/$group/" {} +
            fi
            printf '%s\n' "$result" > "gate-evidence/$group.exit-code"
            if (( result != 0 )); then exit "$result"; fi
          done

      - name: Retain last failing test results and verify no APK was generated
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          if [[ -d app/build/test-results/testDebugUnitTest ]]; then
            mkdir -p gate-evidence/results-last
            find app/build/test-results/testDebugUnitTest -maxdepth 1 -type f -name '*.xml' -exec cp -t gate-evidence/results-last/ {} +
          fi
          if find app/build/outputs -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo '::error::Unexpected APK output; gate must not assemble or sign APKs.'
            exit 1
          fi

      # Temporarily no artifact upload in directed-tests: storage quota exhausted.
      # Full Gradle/runner output remains in the GitHub Actions job logs.
      - name: Summarize compilation and directed test results
        if: always()
        shell: bash
        env:
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          GROUPS_RESULT: ${{ steps.directed.outcome }}
        run: python3 scripts/summarize-directed-gate.py

  raycast-preview:
    if: github.repository == 'bauti3311-sys/Spotlight-Next' && github.ref == 'refs/heads/feat/raycast-sidebar-permissions-20261020' && inputs.mode == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify selected revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = 'refs/heads/feat/raycast-sidebar-permissions-20261020'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/feat/raycast-sidebar-permissions-20261020
          printf 'Building source SHA: '
          git rev-parse HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent Raycast Preview signing identity
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.RAYCAST_PREVIEW_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PREVIEW_KEYSTORE_BASE64" ]]; then
            echo '::error::Dedicated Raycast Preview signing backup must be configured before CI delivery.'
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -J-Duser.language=en -list -v -keystore "$HOME/.android/debug.keystore" -storepass android |
            grep -F 'SHA256: 88:58:38:AA:97:0E:0D:4B:A1:68:A2:B5:F3:E8:F1:A6:E7:33:42:63:C3:4C:9C:BC:88:8F:5C:70:38:1A:52:BA'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build ONLY independent Raycast Preview
        run: bash gradlew :app:assembleRaycastPreview --no-daemon --max-workers=2 --console=plain

      - name: Verify installed identity, signature and hashes
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/raycastPreview/app-raycastPreview.apk'
          test -s "$apk"
          mkdir -p delivery
          cp "$apk" delivery/Spotlight-Next-Raycast-Preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > delivery/signature.txt
          grep -Fq '885838aa970e0d4ba168a2b5f3e8f1a6e7334263c34c9cbc888f5c70381a52ba' delivery/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > delivery/package.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$apk"
          grep -Fq "package: name='dev.bautista.spotlight.next.raycastpreview'" delivery/package.txt
          git rev-parse HEAD > delivery/SOURCE_SHA.txt
          # The matching source ZIP is generated from exactly this checked-out SHA.
          # Git archive excludes untracked SDK caches, signing keys and local credentials.
          git archive --format=zip --prefix="Spotlight-Next-Raycast-Preview-source/" \
            --output=delivery/Spotlight-Next-Raycast-Preview-source.zip HEAD
          unzip -t delivery/Spotlight-Next-Raycast-Preview-source.zip >/dev/null
          (cd delivery && sha256sum Spotlight-Next-Raycast-Preview.apk Spotlight-Next-Raycast-Preview-source.zip > SHA256SUMS)
          {
            echo '### Spotlight Next · Raycast Preview'
            echo 'Build independiente y firmado con certificado Android Debug; NO actualiza el APK principal.'
            echo 'Si ya tenés instalada otra copia Raycast Preview con otra firma, no la sobrescribas para conservar sus datos.'
            echo "Código fuente: $(cat delivery/SOURCE_SHA.txt)"
            echo 'No se ejecutaron pruebas instrumentadas en tablet.'
            echo 'APK, ZIP fuente del mismo SHA, hashes y certificado dentro del artefacto privado.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ONLY verified preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotlight-Next-Raycast-Preview-${{ github.run_number }}
          path: delivery/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
