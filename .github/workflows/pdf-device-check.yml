name: Native PDF Android check

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API (36 = Android16)'
        type: choice
        default: '36'
        options: ['36', '30', '29']
      profile:
        description: 'Tablet by default; phone available for legacy diagnosis'
        type: choice
        default: pixel_c
        options: [pixel_c, pixel_6]

permissions:
  contents: read

concurrency:
  group: spotlight-devices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Free unused hosted runner SDK space for the Android emulator
        # Emulator 37 still reserves over 7 GB despite a smaller AVD disk setting.
        # This job uses Java/Android only; the runner is discarded after the job.
        run: |
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute real PdfRenderer tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          profile: ${{ inputs.profile }}
          arch: x86_64
          # The default userdata partition exceeds free space on hosted runners.
          disk-size: 2G
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            if [ "${{ inputs.api }}" = "36" ] && [ "${{ inputs.profile }}" = "pixel_c" ]; then adb shell wm size 1200x1920; adb shell wm density 240; fi
            bash gradlew :app:connectedDebugAndroidTest --build-cache --no-daemon --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pdf-reports-${{ github.run_number }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore
