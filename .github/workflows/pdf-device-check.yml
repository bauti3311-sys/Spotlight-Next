name: Native PDF Android check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/src/androidTest/**"
      - "app/src/main/java/dev/bautista/spotlight/ui/PdfQuickLook.kt"
      - "app/build.gradle.kts"
      - ".github/workflows/pdf-device-check.yml"

permissions:
  contents: read

concurrency:
  group: native-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute real PdfRenderer tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          # The default userdata partition exceeds free space on hosted runners.
          disk-size: 2G
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pdf-reports-${{ github.run_number }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
