name: Codex development tools

on:
  push:
    branches: [main, chore/codex-infrastructure-2.0.1]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'scripts/**'
      - '.codex/**'
      - '.maestro/**'
      - 'visual-lab/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'renovate.json'
  pull_request:
    branches: [main, chore/codex-infrastructure-2.0.1, test/native-pdf-api36-f13]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'scripts/**'
      - '.codex/**'
      - '.maestro/**'
      - 'visual-lab/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/**'
      - '.agents/**'
      - 'AGENTS.md'
      - 'renovate.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      android: ${{ steps.scope.outputs.android }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .codex/scripts/ci-paths.py
      - name: Cache pinned development tools
        uses: actions/cache@v4
        with:
          path: |
            .codex/tools/gitleaks/
            .codex/tools/actionlint/
          key: ci-tools-${{ runner.os }}-${{ hashFiles('.codex/scripts/install-tool.sh') }}
      - run: bash .codex/scripts/install-tool.sh gitleaks
      - run: bash .codex/scripts/install-tool.sh actionlint
      - name: Validate workflow syntax and expressions
        run: .codex/tools/actionlint/1.7.12/actionlint -color
      - name: Offline Python regressions
        run: |
          python3 -m unittest discover -s backend -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: bash .codex/scripts/check-secrets.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-secrets-${{ github.run_number }}
          path: .codex/artifacts/gitleaks.json
          retention-days: 7
  android-quality:
    needs: secrets
    if: needs.secrets.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: bash .codex/scripts/doctor.sh android
      - name: Functional tests, lint and build
        run: |
          bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest -Pspotlight.test.verbose=true --build-cache --no-daemon --max-workers=2 --console=plain
          mkdir -p app/build/functional-unit-evidence
          cp -R app/build/test-results/testDebugUnitTest app/build/functional-unit-evidence/
          cp -R app/build/reports/tests/testDebugUnitTest app/build/functional-unit-evidence/html
      - name: Compare approved native pixel baselines
        run: bash gradlew :app:verifyRoborazziDebug --tests '*VisualSnapshotTest' --build-cache --no-daemon --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-functional-visual-${{ github.run_number }}
          path: |
            app/build/functional-unit-evidence/
            app/build/test-results/
            app/build/reports/
            app/build/outputs/roborazzi/
            app/build/091-ui/f1-width-*.png
            app/build/091-ui/f12-*.png
            app/build/091-ui/f13-*.png
          retention-days: 14
  web-lab:
    needs: secrets
    if: needs.secrets.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visual-lab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-lab-tablet-phone-${{ github.run_number }}
          path: |
            visual-lab/test-results/
            visual-lab/playwright-report/
          retention-days: 14
